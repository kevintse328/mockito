version: 2.1

# TODO: import the orb that provides the `with_tool_cache` step and the
# `cache` subcommand it wraps — see the cache-server variant below.
# orbs:
#   internal-cache: circleci/internal-tool-cache@x.y.z

executors:
  gradle-machine:
    machine:
      image: ubuntu-2604:current
    # The resource class the tool-cache feature is validated against —
    # swap it if your org runs the feature on a different class.
    resource_class: large.gen3
    environment:
      GRADLE_OPTS: -Dorg.gradle.welcome=never

commands:
  # Mockito's own CI builds with JDK 17 (Zulu, via actions/setup-java) — any
  # conformant OpenJDK 17 build works, since the JDK vendor isn't part of
  # what we're benchmarking. Using Ubuntu's own openjdk-17-jdk package
  # instead of Eclipse Temurin: Adoptium's own download servers have been
  # observed throttling to ~100-200 kB/s for the ~167 MB JDK download (a
  # known pain point under CI-scale traffic), while archive.ubuntu.com is
  # fast and already the trusted source for everything else in this image.
  install-jdk-17:
    steps:
      - run:
          name: Install OpenJDK 17
          command: |
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
            sudo update-alternatives --set java "$(update-alternatives --list java | grep 'java-17')"
            echo "export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$BASH_ENV"
            java -version

  timed_build:
    parameters:
      step_name:
        type: string
      command:
        type: string
    steps:
      - run:
          name: << parameters.step_name >>
          command: |
            start=$(date +%s%N)
            << parameters.command >>
            end=$(date +%s%N)
            echo "export BUILD_NS=$((end - start))" >> "$BASH_ENV"

  # Runs the build with --info, tees the full log to disk, then counts
  # how many tasks came back FROM-CACHE vs. UP-TO-DATE vs. actually executed.
  # This is the "what did it actually pull" visibility, independent of timing.
  gradle_build_with_cache_summary:
    parameters:
      variant:
        type: string
    steps:
      - run:
          name: "Task outcome summary (<< parameters.variant >>)"
          when: always
          command: |
            log="/tmp/gradle-build-<< parameters.variant >>.log"
            if [ ! -f "$log" ]; then
              echo "No log found at $log — build likely failed before logging started."
              exit 0
            fi
            # Strip any trailing \r first (a pty on the machine executor can
            # inject these even under --console=plain), so anchored matches
            # below aren't silently defeated by an invisible character.
            clean_log="/tmp/gradle-build-<< parameters.variant >>.clean.log"
            tr -d '\r' < "$log" > "$clean_log"

            # Real task-status lines look like "> Task :module:task FROM-CACHE"
            # (Gradle renders this prefix even under --console=plain when a
            # pty is attached, e.g. on the machine executor).
            #
            # Each task actually produces up to TWO lines: a bare
            # "> Task :path" announcement when it starts, then a second
            # "> Task :path FROM-CACHE"/"UP-TO-DATE"/etc. line once its
            # outcome is known — tasks that just execute normally only ever
            # get the first, bare line. Counting lines directly therefore
            # double-counts every cache/skip/no-source outcome (one line
            # for the start, one for the result). Instead, build a map of
            # task path -> last status seen; since the bare line always
            # comes first and any real outcome line comes after, the last
            # value per path is the correct final status.
            echo "--- Sample of raw task-status lines (first 15) ---"
            grep -m 15 -E '^> Task :\S+' "$clean_log"
            echo "----------------------------------------------------"

            # Avoiding a heredoc/here-string here on purpose: CircleCI's
            # config preprocessor treats two consecutive angle brackets as
            # the start of a parameter tag, which is exactly what bit us
            # earlier when a plain bash heredoc triggered an unclosed-tag
            # error. Using set -- sidesteps the whole issue.
            set -- $(awk '
              /^> Task :/ {
                line = $0
                sub(/^> Task /, "", line)
                split(line, parts, " ")
                path = parts[1]
                status = (length(parts) >= 2) ? parts[2] : "EXECUTED"
                status_by_path[path] = status
              }
              END {
                for (p in status_by_path) {
                  s = status_by_path[p]
                  total++
                  if (s == "FROM-CACHE") from_cache++
                  else if (s == "UP-TO-DATE") up_to_date++
                  else if (s == "NO-SOURCE") no_source++
                  else if (s == "SKIPPED") skipped++
                  else executed++
                }
                printf "%d %d %d %d %d %d\n", from_cache+0, up_to_date+0, no_source+0, skipped+0, executed+0, total+0
              }
            ' "$clean_log")
            from_cache=$1; up_to_date=$2; no_source=$3; skipped=$4; executed=$5; total_tasks=$6
            echo "Variant:      << parameters.variant >>"
            echo "Total tasks:  ${total_tasks}"
            echo "FROM-CACHE:   ${from_cache}"
            echo "UP-TO-DATE:   ${up_to_date}"
            echo "NO-SOURCE:    ${no_source}"
            echo "SKIPPED:      ${skipped}"
            echo "Executed:     ${executed}"
            mkdir -p /tmp/bench-results/gradle-cache-summary
            echo "${from_cache},${up_to_date},${no_source},${skipped},${executed},${total_tasks}" \
              > "/tmp/bench-results/gradle-cache-summary/<< parameters.variant >>"
      - store_artifacts:
          path: /tmp/gradle-build-<< parameters.variant >>.log
          destination: gradle-logs/<< parameters.variant >>.log

jobs:
  # Populates BOTH cache backends, via two separate builds:
  #
  # 1. with_tool_cache seeds whatever backing store the cache-server
  #    mechanism uses (confirmed from an earlier run's log to be a local
  #    HTTP proxy, not the on-disk ~/.gradle/caches/build-cache-1 dir).
  # 2. A second, plain build with Gradle's *local* disk cache explicitly
  #    enabled populates build-cache-1 for real, so that save_cache below
  #    is actually snapshotting real task-output cache entries — not just
  #    the downloaded-dependency cache under modules-2. Without this
  #    second pass, the circleci-cache variant's restore_cache pulls a
  #    ~/.gradle/caches that never had build-cache-1 entries in it, so it
  #    can only ever save dependency-download time, not task-execution
  #    time — a different (and smaller) effect than cache-server measures.
  seed-gradle:
    executor: gradle-machine
    steps:
      - checkout
      - install-jdk-17
      - with_tool_cache:
          tool: gradle
          steps:
            - run:
                name: Seed build (cache-server backing store)
                command: |
                  ./gradlew --no-daemon --build-cache --console=plain --info clean build \
                    2>&1 | tee /tmp/gradle-build-seed.log
      - run:
          name: Seed build (local disk build cache, for circleci-cache)
          command: |
            mkdir -p ~/.gradle/init.d
            cat > ~/.gradle/init.d/circleci.gradle.kts \<<'INNEREOF'
            settingsEvaluated {
              buildCache {
                local { isEnabled = true }
              }
            }
            INNEREOF
            ./gradlew --no-daemon --build-cache --console=plain --info clean build \
              2>&1 | tee /tmp/gradle-build-seed-local.log
            rm -f ~/.gradle/init.d/circleci.gradle.kts
      - save_cache:
          # Same CIRCLE_WORKFLOW_ID across every job in this workflow run,
          # so this is an exact key, not a prefix fallback — no ambiguity
          # about "most recent," and no risk of a concurrent run's cache
          # winning the slot.
          key: mockito-gradle-bench-{{ .Environment.CIRCLE_WORKFLOW_ID }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

  benchmark-gradle:
    executor: gradle-machine
    parameters:
      use_cache_subcommand:
        type: boolean
      use_circleci_cache:
        type: boolean
        default: false
    steps:
      - checkout
      - install-jdk-17
      - run:
          name: Record variant name
          command: |
            variant="<<# parameters.use_cache_subcommand >>cache-server<</ parameters.use_cache_subcommand >><<^ parameters.use_cache_subcommand >><<# parameters.use_circleci_cache >>circleci-cache<</ parameters.use_circleci_cache >><<^ parameters.use_circleci_cache >>no-cache<</ parameters.use_circleci_cache >><</ parameters.use_cache_subcommand >>"
            echo "export BENCH_VARIANT=$variant" >> "$BASH_ENV"
      - unless:
          condition: << parameters.use_cache_subcommand >>
          steps:
            - when:
                condition: << parameters.use_circleci_cache >>
                steps:
                  - run:
                      name: Start cache restore + build timer
                      command: echo "export TIMER_START_NS=$(date +%s%N)" >> "$BASH_ENV"
                  - restore_cache:
                      keys:
                        # Exact match against this workflow run's own seed —
                        # see the note on save_cache above.
                        - mockito-gradle-bench-{{ .Environment.CIRCLE_WORKFLOW_ID }}
                  - run:
                      name: Write Gradle init script (local build cache from restored dir)
                      command: |
                        mkdir -p ~/.gradle/init.d
                        cat > ~/.gradle/init.d/circleci.gradle.kts \<<'INNEREOF'
                        settingsEvaluated {
                          buildCache {
                            local { isEnabled = true }
                          }
                        }
                        INNEREOF
                        cat ~/.gradle/init.d/circleci.gradle.kts
            - unless:
                condition: << parameters.use_circleci_cache >>
                steps:
                  - run:
                      name: Write Gradle init script (caches disabled — true baseline)
                      command: |
                        mkdir -p ~/.gradle/init.d
                        cat > ~/.gradle/init.d/circleci.gradle.kts \<<'INNEREOF'
                        settingsEvaluated {
                          buildCache {
                            local { isEnabled = false }
                          }
                        }
                        INNEREOF
                        cat ~/.gradle/init.d/circleci.gradle.kts
      - when:
          condition: << parameters.use_cache_subcommand >>
          steps:
            - restore_cache:
                # Same exact-match key as circleci-cache above. This gives
                # cache-server a warm ~/.gradle/caches/modules-2 too — the
                # dependency-download cache used to resolve buildSrc's
                # plugin classpath (Kotlin, Android tooling, etc.), which
                # is a *different* cache from the build-cache-1 task-output
                # cache and has nothing to do with with_tool_cache. Without
                # this, cache-server was paying for ~200+ real network
                # round-trips per run that circleci-cache got for free via
                # its own restore_cache — inflating the gap between them
                # with an effect neither variant's mechanism was supposed
                # to be measured on.
                keys:
                  - mockito-gradle-bench-{{ .Environment.CIRCLE_WORKFLOW_ID }}
            - run:
                # Strip out any local disk build-cache entries the restore
                # just brought in, so every FROM-CACHE/UP-TO-DATE hit this
                # variant gets is forced through the remote tool-cache
                # proxy being tested — not an incidental local-disk hit
                # riding along on the same restored directory.
                name: Clear local build-cache-1 (keep modules-2 warm)
                command: rm -rf ~/.gradle/caches/build-cache-1
            - with_tool_cache:
                tool: gradle
                steps:
                  - timed_build:
                      step_name: "clean build (cache-server)"
                      command: |
                        ./gradlew --no-daemon --build-cache --console=plain --info clean build \
                          2>&1 | tee /tmp/gradle-build-cache-server.log
      - unless:
          condition: << parameters.use_cache_subcommand >>
          steps:
            - timed_build:
                step_name: "clean build"
                command: |
                  ./gradlew --no-daemon --build-cache --console=plain --info clean build \
                    2>&1 | tee "/tmp/gradle-build-${BENCH_VARIANT}.log"
      - gradle_build_with_cache_summary:
          # Must be the same static Mustache expression used for
          # $BENCH_VARIANT above, not the runtime bash variable itself:
          # command parameters resolve at config-compile time, before any
          # shell runs, so store_artifacts (a static field, not a bash
          # context) would otherwise get the literal string
          # "${BENCH_VARIANT}" instead of the real variant name.
          variant: "<<# parameters.use_cache_subcommand >>cache-server<</ parameters.use_cache_subcommand >><<^ parameters.use_cache_subcommand >><<# parameters.use_circleci_cache >>circleci-cache<</ parameters.use_circleci_cache >><<^ parameters.use_circleci_cache >>no-cache<</ parameters.use_circleci_cache >><</ parameters.use_cache_subcommand >>"
      - run:
          name: Record result
          when: always
          command: |
            mkdir -p /tmp/bench-results/gradle
            if [ -n "${BUILD_NS:-}" ]; then
              echo $((BUILD_NS / 1000000)) > /tmp/bench-results/gradle/$BENCH_VARIANT
            else
              echo FAILED > /tmp/bench-results/gradle/$BENCH_VARIANT
            fi
            cat /tmp/bench-results/gradle/$BENCH_VARIANT
      - persist_to_workspace:
          when: always
          root: /tmp
          paths:
            - bench-results

  benchmark-report:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp
      - run:
          name: Timing + cache-hit report
          command: |
            echo "=== Build time ==="
            printf "%-15s %10s\n" "Variant" "Time (ms)"
            printf "%-15s %10s\n" "---------------" "----------"
            for variant in no-cache cache-server circleci-cache; do
              f="/tmp/bench-results/gradle/$variant"
              if [ -f "$f" ]; then
                printf "%-15s %10s\n" "$variant" "$(cat "$f")"
              else
                printf "%-15s %10s\n" "$variant" "(missing)"
              fi
            done
            echo
            echo "=== Task outcomes (FROM-CACHE / UP-TO-DATE / NO-SOURCE / SKIPPED / Executed / Total) ==="
            for variant in no-cache cache-server circleci-cache; do
              f="/tmp/bench-results/gradle-cache-summary/$variant"
              if [ -f "$f" ]; then
                echo "$variant: $(cat "$f")"
              else
                echo "$variant: (missing)"
              fi
            done

workflows:
  cache-comparison:
    jobs:
      - seed-gradle
      - benchmark-gradle:
          name: "Gradle - No caching"
          use_cache_subcommand: false
          use_circleci_cache: false
          requires:
            - seed-gradle
      - benchmark-gradle:
          name: "Gradle - Cache server"
          use_cache_subcommand: true
          use_circleci_cache: false
          requires:
            - seed-gradle
      - benchmark-gradle:
          name: "Gradle - CircleCI cache"
          use_cache_subcommand: false
          use_circleci_cache: true
          requires:
            - seed-gradle
      - benchmark-report:
          requires:
            - "Gradle - No caching"
            - "Gradle - Cache server"
            - "Gradle - CircleCI cache"
